name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      # No DATABASE_URL, TEST_DATABASE_URL, Gmail credentials or LM Studio endpoint:
      # tests/conftest.py refuses real databases and network access.
      - run: python -m pytest tests/ -q
